# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
# This fork builds the Windows VST3 only: one runner per push.
name: RRV10

on:
  push:
    branches:
      - '**'

jobs:
  build-win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           cd reverb
           git clone -b 8.0.7 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: windows
    - name: "Build RRV10"
      run: sh -ex ./reverb/build/build-win.sh
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RRV10-win-vst3
        path: ./reverb/Builds/VisualStudio2022/x64/Release/VST3/RRV10.vst3
        if-no-files-found: error
